<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ألوان هَب - شاشة ترحيب</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; overflow: hidden; background: white; }
    
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      transition: opacity 1s ease, transform 1s ease;
    }
    
    #splash.fade-out {
      opacity: 0;
      transform: scale(1.1);
    }
    
    .bg {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #eff6ff 0%, white 50%, #f5f3ff 100%);
    }
    
    .circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.3;
      animation: pulse 3s ease-in-out infinite;
    }
    .c1 { top: 25%; right: 25%; width: 256px; height: 256px; background: #bfdbfe; }
    .c2 { bottom: 25%; left: 25%; width: 384px; height: 384px; background: #e9d5ff; animation-delay: 1s; }
    .c3 { top: 50%; left: 50%; width: 192px; height: 192px; background: #fde68a; animation-delay: 2s; }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.2); opacity: 0.5; }
    }
    
    .content {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    .gif-wrap {
      position: absolute;
      inset: 0;
    }
    .gif-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.3) 40%, transparent 100%);
    }
    
    .text-box {
      position: absolute;
      bottom: 100px;
      left: 0;
      right: 0;
      text-align: center;
      padding: 0 20px;
      animation: fadeUp 1s ease;
    }
    
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    h1 {
      font-size: 72px;
      font-weight: 900;
      color: white;
      margin-bottom: 16px;
      text-shadow: 3px 3px 12px rgba(0,0,0,0.6);
      letter-spacing: 2px;
    }
    
    p {
      font-size: 26px;
      color: rgba(255,255,255,0.95);
      font-weight: 300;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
      margin-bottom: 32px;
    }
    
    .dots {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    
    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      animation: bounce 1.4s ease-in-out infinite;
    }
    .d1 { background: #3b82f6; animation-delay: 0s; }
    .d2 { background: #a855f7; animation-delay: 0.15s; }
    .d3 { background: #fbbf24; animation-delay: 0.3s; }
    
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
      40% { transform: scale(1.3); opacity: 1; }
    }
    
    @media (max-width: 768px) {
      h1 { font-size: 48px; }
      p { font-size: 20px; }
      .text-box { bottom: 60px; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="bg"></div>
    <div class="circle c1"></div>
    <div class="circle c2"></div>
    <div class="circle c3"></div>
    <div class="content">
      <div class="gif-wrap">
        <img src="images/splash.gif" alt="Alwan Hub Splash">
      </div>
      <div class="overlay"></div>
      <div class="text-box">
        <h1>ألوان هَب</h1>
        <p>ألوان تنبض بالحياة</p>
        <div class="dots">
          <div class="dot d1"></div>
          <div class="dot d2"></div>
          <div class="dot d3"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // بعد 4.5 ثانية، ابدأ الخروج
    setTimeout(function() {
      document.getElementById('splash').classList.add('fade-out');
      
      // بعد ثانية واحدة، انتقل للموقع الرئيسي
      setTimeout(function() {
        window.location.href = '/';
      }, 1000);
    }, 4500);
  </script>
</body>
</html>
