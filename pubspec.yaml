name: alwan_hub
description: Alwan Hub - Digital Media Platform
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management & Architecture
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.1

  # Network & Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.6

  # Audio & Media Playback
  just_audio: 0.10.5
  audio_service: 0.18.18
  video_player: ^2.13.0

  # UI & Animations
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1

  # Utilities & Integration
  intl: ^0.20.2
  url_launcher: ^6.3.1
  share_plus: ^11.0.0
  uuid: ^4.6.0
  path: ^1.9.0
  file_picker: 10.3.10
  record: ^7.1.1
  http: ^1.6.0
  speech_to_text: ^7.4.0
  flutter_compass: ^0.8.1
  adhan_dart: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/banners/
    - assets/images/quick_access/
    - assets/images/lounge/
    - assets/images/fm/logos/
    - assets/images/fm/covers/
    - assets/images/fm/programs_hero_v2.png
    - assets/images/web/
    - assets/videos/
  fonts:
    - family: MohammadBoldArt
      fonts:
        - asset: assets/fonts/MohammadBoldArt.ttf
          weight: 700
